services:
  - type: web
    name: fatihworkingtools
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: WITHOUTBG_API_KEY
        sync: false
